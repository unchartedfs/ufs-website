<div class="hero">
    <div class="hero-grid">
        <div class="hero-left">
            <img src="{{ .Params.hero.logo.wordmarkColor }}" alt="{{.Site.Title}} wordmark" class="wordmark">
            <h1 class="tagline">{{ .Params.hero.tagline }}</h1>
        </div>
        <div class="hero-right">
            <img src="{{ .Params.hero.logo.outline }}" alt="{{.Site.Title}} logo" class="logo">
        </div>
    </div>
    <div class="arrow-container">
        <img src="{{ .Params.hero.arrow }}" alt="Scroll down" class="arrow">
    </div>
</div>
