<!-- Primary Meta Tags -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ .Site.Title }} | {{ .Site.Params.domain }}</title>
<meta name="title" content="{{ .Site.Title }} | {{ .Site.Params.domain }}">
<meta name="description" content="{{ with .Site.Params.overview }}{{ . }}{{ end }}">
<meta name="author" content="{{ .Site.Params.author | default "Uncharted Software" }}">

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ .Site.Params.favicon }}">

{{ template "_internal/opengraph.html" . }}
{{ template "_internal/twitter_cards.html" . }}

<!-- Additional Meta Tags -->
<meta name="robots" content="index, follow">
<meta name="language" content="{{ .Site.LanguageCode | default "en" }}">
<meta name="revisit-after" content="7 days">
<meta name="generator" content="Hugo {{ hugo.Version }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Cookie Consent Stylesheet -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v2.9.1/dist/cookieconsent.css" media="print" onload="this.media='all'">

<!-- Stylesheets -->
<link rel="stylesheet" href="/css/fonts.css?v={{ now.Unix }}">
<link rel="stylesheet" href="/css/main.css?v={{ now.Unix }}">
<link rel="stylesheet" href="/css/custom.css?v={{ now.Unix }}">
<link rel="stylesheet" href="/css/lib/aos.css?v={{ now.Unix }}">

<!-- Cookie Consent Custom Styling -->
<style>
.theme_uncharted {
  --cc-bg: #1e2428;
  --cc-text: #ffffff;
  --cc-btn-primary-bg: #e02429;
  --cc-btn-primary-text: #ffffff;
  --cc-btn-primary-hover-bg: #c21e23;
  --cc-btn-secondary-bg: #374151;
  --cc-btn-secondary-text: #ffffff;
  --cc-btn-secondary-hover-bg: #4b5563;
  --cc-btn-secondary-hover-text: #ffffff;
  --cc-toggle-bg-off: #667481;
  --cc-toggle-bg-on: #e02429;
  --cc-toggle-bg-readonly: #343e45;
  --cc-toggle-knob-bg: #ffffff;
  --cc-toggle-knob-icon-color: #1e2428;
  --cc-cookie-category-block-bg: #2d3748;
  --cc-cookie-category-block-bg-hover: #374151;
  --cc-section-border: #4a5568;
  --cc-block-text: #ffffff;
  --cc-cookie-table-border: #4a5568;
  --cc-overlay-bg: rgba(4, 6, 8, .85);
  --cc-webkit-scrollbar-bg: #2c343a;
  --cc-webkit-scrollbar-bg-hover: #384148;
}
</style>

<!-- Additional head content -->
{{ block "head" . }}{{ end }}

<!-- Google Analytics with Cookie Consent -->
{{ with site.Config.Services.GoogleAnalytics.ID }}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  function gtag_consent(initial, grant) {
    gtag("consent", initial, {
      ad_storage: grant,
      analytics_storage: grant,
      functionality_storage: grant,
      personalization_storage: grant,
      security_storage: grant
    });
  }

  gtag_consent("default","denied");
</script>
<!-- Google tag (gtag.js) -->
<script defer type="text/plain" data-cookiecategory="performance" async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script defer type="text/plain" data-cookiecategory="performance">
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ . }}');
</script>
{{ end }}
